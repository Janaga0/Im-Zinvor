<!DOCTYPE html>
<html lang="hy" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Իմ Զինվոր</title>
<style>
:root{--bg:#f6f1ea;--fg:#1a1a2e;--mut:#6f7390;--card:#ffffff;--acc:#2e3901;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--fg:#f4f1ea;--mut:#8b93b0;--card:rgba(13,18,38,.62);--acc:#2e3901;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1226;--fg:#f4f1ea;--mut:#8b93b0;--card:rgba(13,18,38,.62);--acc:#2e3901;color-scheme:dark}
.bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;transition:background-image .3s}.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(8,10,24,.45),rgba(8,10,24,.7))}
.th{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:13px;color:var(--mut)}.th div{position:relative;width:56px;height:72px;background-size:cover;background-position:center;border-radius:8px}.th button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#000;color:#fff;font-size:12px;line-height:22px;padding:0}
.setup .app>*:not(.top):not(.form){display:none}.hint{display:none;font-size:19px;font-weight:700;margin-bottom:6px}.setup .hint{display:block}
.addbtn{display:block;margin-top:8px;padding:12px;border-radius:10px;background:var(--acc);color:#fff;text-align:center;font-weight:700;font-size:15px;cursor:pointer}.hid{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.flag{height:6px;background:linear-gradient(90deg,#2e3901,#2e3901)}
*{box-sizing:border-box}
html{background:var(--bg)}html,body{margin:0;color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Armenian",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;padding:14px 20px 40px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bars{display:flex;gap:2px;height:46px;margin:18px 0 10px}
.bars i{flex:1;background:var(--mut);opacity:.3;border-radius:4px}
.bars i.on{background:#2e3901;opacity:1;box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.tog{display:flex;justify-content:space-around;font-weight:700;font-size:14px;color:var(--mut);margin-bottom:14px}
.tog button{padding:7px 18px;border-radius:20px}.tog .a{color:#fff;background:#2e3901}
.big{text-align:center;font-size:40px;font-weight:600;line-height:1.15;min-height:130px}
.big small{display:block;font-size:30px;color:var(--mut);font-weight:700}
.big.pct{text-align:center;min-height:60px}
.tabs{display:flex;font-weight:800;color:var(--mut);padding:6px;background:var(--card);border-radius:16px;margin:6px 0}
.tabs button{flex:1;padding:9px 0;border-radius:11px}.tabs .a{color:#fff;background:var(--acc)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px 0 8px}
.cols>div{background:var(--card);border-radius:18px;padding:16px;border-top:4px solid #2e3901}.cols>div+div{border-top-color:#2e3901}.cols h3{margin:0 0 8px;font-size:20px}
.cols b{display:block;font-size:20px;line-height:1.3}
.cols span{display:block;color:var(--mut);font-size:17px;margin-top:8px;line-height:1.35}
.tabs.u{margin-top:10px}
.ev{display:flex;align-items:center;gap:20px;margin-top:18px;padding:16px;border-radius:18px;background:var(--card);border-left:4px solid var(--acc)}
.ev svg{width:64px;flex:none}
.ev b{font-size:22px;display:block}.ev span{display:block;color:var(--mut);font-size:18px;margin-top:4px}
.form{display:none;background:var(--card);border-radius:14px;padding:16px;margin-top:16px}
.form.show{display:block}
.form label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.form input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font:inherit}
.save{margin-top:14px;width:100%;padding:12px;border-radius:10px;background:var(--acc);color:#111;font-weight:700}
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="shade"></div><div class="flag"></div><div class="app">
 <div class="top"><span>🪖</span><span id="nm">Իմ Զինվոր</span><button id="gear">⚙️</button></div>
 <div class="form" id="form">
  <div class="hint">Մուտքագրիր ծառայության ժամկետը 🪖</div>
  <label>Անուն</label><input id="fn" placeholder="Օր.՝ Հոգիս ❤️">
  <label>Ծառայության սկիզբ</label><input id="fs" type="datetime-local">
  <label>Զորացրման ամսաթիվ</label><input id="fe" type="datetime-local">
  <label>Զինվորի անունը</label><input id="ft" placeholder="Օր.՝ Արամ">
  <label>Ֆոնային նկարներ (կարող ես ընտրել մի քանիսը)</label><label class="addbtn" for="fi">📷 Ավելացնել նկարներ</label><input id="fi" class="hid" type="file" accept="image/jpeg,image/png,image/webp,image/*" multiple><div class="th" id="th"></div><div id="st" class="th"></div>
  <button class="save" id="save">Պահպանել</button>
 </div>
 <div class="bars" id="bars"></div>
 <div class="tog"><button id="tp">ԱՆՑԵԼ Է</button><button id="tr" class="a">ՄՆԱՑԵԼ Է</button></div>
 <div class="big" id="big"></div>
 <div class="tabs" id="t1"></div>
 <div class="cols">
  <div><h3>Անցել է</h3><b id="pm"></b><span id="ph"></span></div>
  <div><h3>Մնացել է</h3><b id="rm"></b><span id="rh"></span></div>
 </div>
 <div class="tabs u" id="t2"></div>
 <div class="ev"><span style="font-size:52px;line-height:1">🪖</span><div><b id="et"></b></div></div>
</div>

var T1="p",showRem=true,T2="d";
var $=function(i){return document.getElementById(i)};
var B=$("bars");for(var i=0;i<60;i++)B.appendChild(document.createElement("i"));
function tabs(el,items,get,set){el.innerHTML="";items.forEach(function(it){var b=document.createElement("button");b.textContent=it[1];if(get()===it[0])b.className="a";b.onclick=function(){set(it[0]);render()};el.appendChild(b)})}
function fmt(n){return Math.floor(n).toLocaleString("en-US")}
function addM(d,m){var r=new Date(d);r.setMonth(r.getMonth()+m);return r}
function split(a,b,mode){
 var ms=Math.max(0,b-a),main,rem,ex="",d;
 if(mode==="d"){d=Math.floor(ms/864e5);main=d+" օր";rem=ms-d*864e5}
 else if(mode==="w"){var w=Math.floor(ms/6048e5);main=w+" շաբաթ";rem=ms-w*6048e5;d=Math.floor(rem/864e5);ex=d+" օր<br>";rem-=d*864e5}
 else{var mo=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();while(mo>0&&addM(a,mo)>b)mo--;
  rem=b-addM(a,mo);
  if(mode==="y"){var y=Math.floor(mo/12);main=y+" տարի";if(mo-y*12)ex=(mo-y*12)+" ամիս<br>"}else main=mo+" ամիս";
  d=Math.floor(rem/864e5);ex+=d+" օր<br>";rem-=d*864e5}
 var hh=Math.floor(rem/36e5),mi=Math.floor(rem%36e5/6e4),se=Math.floor(rem%6e4/1e3);
 return[main,ex+hh+" ժամ<br>"+mi+" րոպե<br>"+se+" վայրկյան"]}
function render(){
 var a=new Date(S.start),b=new Date(S.end),n=new Date(),tot=b-a,pas=Math.min(Math.max(n-a,0),tot),rem=tot-pas,p=tot?pas/tot*100:0;
 $("nm").textContent=S.name||"Իմ Զինվոր";
 var on=Math.round(p/100*60);[].forEach.call(B.children,function(x,i){x.className=i<on?"on":""});
 $("tp").className=showRem?"":"a";$("tr").className=showRem?"a":"";
 var big=$("big"),v=showRem?rem:pas;
 if(T1==="p"){big.className="big pct";big.textContent=(showRem?100-p:p).toFixed(6)+"%"}
 else{var div={s:1e3,m:6e4,h:36e5}[T1],u={s:"վայրկյան",m:"րոպե",h:"ժամ"}[T1];big.className="big";big.innerHTML=fmt(v/div)+"<small>"+u+"՝</small>"+"<small>"+fmt(tot/div)+"</small>"}
 tabs($("t1"),[["p","%"],["s","Վ"],["m","Ր"],["h","Ժ"]],function(){return T1},function(x){T1=x});
 tabs($("t2"),[["d","Օ"],["w","Շ"],["m","Ա"],["y","Տ"]],function(){return T2},function(x){T2=x});
 var x=split(a,n<a?a:n,T2),y=split(n>b?b:n,b,T2);
 $("pm").innerHTML=x[0];$("ph").innerHTML=x[1];$("rm").innerHTML=y[0];$("rh").innerHTML=y[1];
 $("et").textContent=S.et}
$("tp").onclick=function(){showRem=false;render()};$("tr").onclick=function(){showRem=true;render()};
$("gear").onclick=function(){var f=$("form");f.classList.toggle("show");$("fn").value=S.name;$("fs").value=S.start;$("fe").value=S.end;$("ft").value=S.et};
$("save").onclick=function(){if(!$("fs").value||!$("fe").value||new Date($("fe").value)<=new Date($("fs").value)){st("Նշիր ծառայության սկիզբը և զորացրման ամսաթիվը (վերջը՝ սկիզբից հետո)");return}S.name=$("fn").value||"Իմ Զինվոր";S.start=$("fs").value||S.start;S.end=$("fe").value||S.end;S.et=$("ft").value;try{localStorage.setItem("imzinvor",JSON.stringify(S))}catch(e){}$("form").classList.remove("show");document.documentElement.classList.remove("setup");st("");render()};
var DEF=IMGS.slice(),US=[],db=null;
function st(m){var e=$("st");if(e)e.textContent=m||""}
function useImgs(){IMGS=US.length?US.slice():DEF.slice();bi=0}
function idb(cb){try{var q=indexedDB.open("imzinvor",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv")};q.onsuccess=function(){db=q.result;cb()};q.onerror=function(){cb()};q.onblocked=function(){cb()}}catch(e){cb()}}
function saveUS(){try{if(db){db.transaction("kv","readwrite").objectStore("kv").put(US,"imgs");return true}}catch(e){}try{localStorage.setItem("imzinvor_imgs",JSON.stringify(US));return true}catch(e){}return false}
function thumbs(){var t=$("th");t.innerHTML="";if(!US.length){t.textContent="Օգտագործվում են սկզբնական նկարները";return}US.forEach(function(u,i){var d=document.createElement("div");d.style.backgroundImage="url("+u+")";var x=document.createElement("button");x.textContent="✕";x.onclick=function(){US.splice(i,1);saveUS();useImgs();setBg();thumbs()};d.appendChild(x);t.appendChild(d)})}
function shrink(f,cb){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){try{var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);var d=c.toDataURL("image/jpeg",.7);URL.revokeObjectURL(u);cb(d)}catch(e){cb(null)}};im.onerror=function(){URL.revokeObjectURL(u);cb(null)};im.src=u}

 fs.forEach(function(f){shrink(f,function(d){if(d&&US.length<12){US.push(d);ok++}if(--n===0){var s=saveUS();useImgs();setBg();thumbs();st(ok?(s?"Ավելացվեց "+ok+" նկար ✓":"Ավելացվեց "+ok+" նկար (չի պահվի էջը փակելուց հետո)"):"Նկարը չհաջողվեց բացել. փորձիր JPG կամ PNG");try{inp.value=""}catch(e){}}})})};
